{#- SoftwareApplication with one Offer per plan in _data/plans.json. Include by setting softwareSchema: true in front matter. -#}
<script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":{{ site.title | dump | safe }},"url":{{ site.url | dump | safe }},"applicationCategory":"BusinessApplication","operatingSystem":"Web","description":"Government website monitoring for accessibility, security, usability, and AI-readiness, scored against open standards.","publisher":{"@type":"Organization","name":{{ site.org | dump | safe }},"url":{{ site["org-url"] | dump | safe }}},"offers":[{% for plan in plans %}{"@type":"Offer","name":{{ plan.title | dump | safe }},"price":"{{ plan.price | replace("$", "") | replace(",", "") | replace("/mo", "") }}","priceCurrency":"USD","url":{{ plan.ctaUrl | dump | safe }},"availability":"https://schema.org/InStock","description":{{ (plan.checks | join(". ") + ". Billed monthly.") | dump | safe }}}{% if not loop.last %},{% endif %}{% endfor %}]}</script>
