{#- WebPage + BreadcrumbList for ordinary pages. Posts use NewsArticle in header.html instead. -#}
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebPage","name":{{ (title or site.title) | dump | safe }},"description":{{ (description or site.description) | dump | safe }},"url":{{ (site.url + page.url) | dump | safe }}{% if modified %},"dateModified":{{ (modified.toISOString() if modified.toISOString else modified) | dump | safe }}{% endif %},"isPartOf":{"@type":"WebSite","name":{{ site.title | dump | safe }},"url":{{ site.url | dump | safe }}}}</script>
{%- if page.url != "/" %}
<script type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":{{ site.url | dump | safe }}}{% for crumb in breadcrumbParent %},{"@type":"ListItem","position":{{ loop.index + 1 }},"name":{{ crumb.title | dump | safe }},"item":{{ (site.url + crumb.url) | dump | safe }}}{% endfor %},{"@type":"ListItem","position":{{ (breadcrumbParent | length) + 2 }},"name":{{ (breadcrumbCurrent or title) | dump | safe }},"item":{{ (site.url + page.url) | dump | safe }}}]}</script>
{%- endif %}
