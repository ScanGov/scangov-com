---
layout: "layouts/default"
title: "Digital experience policy"
description: "A digital experience policy generated with the ScanGov policy generator."
permalink: /tools/policy-generator/done/
sitemap: false
noindex: true
---

<div class="container">
  <div class="row">
    <div class="col-12 col-sm-12 col-md-1 col-lg-1 col-xl-1"></div>
    <div class="col-12 col-sm-12 col-md-10 col-lg-10 col-xl-10">
      <div class="mb-4 pb-4 border-bottom">
        <ul class="nav nav-pills mt-2 mb-2 small">
          <li class="nav-item">
            <button type="button" id="copy-link" class="nav-link btn btn-primary-outline mx-1">
              <i class="fa-solid fa-link" aria-hidden="true"></i>
              <small>Copy link</small>
            </button>
          </li>
          <li class="nav-item">
            <button type="button" id="copy-text" class="nav-link btn btn-primary-outline mx-1">
              <i class="fa-solid fa-copy" aria-hidden="true"></i>
              <small>Copy text</small>
            </button>
          </li>
          <li class="nav-item">
            <a id="print-link" href="/tools/policy-generator/print/" class="nav-link btn btn-primary-outline mx-1">
              <i class="fa-solid fa-print" aria-hidden="true"></i>
              <small>Print</small>
            </a>
          </li>
          <li class="nav-item">
            <button type="button" id="download-pdf" class="nav-link btn btn-primary-outline mx-1">
              <i class="fa-solid fa-file-pdf" aria-hidden="true"></i>
              <small>Download as PDF</small>
            </button>
          </li>
          <li class="nav-item">
            <button type="button" id="publish-site" class="nav-link btn btn-primary-outline mx-1">
              <i class="fa-solid fa-globe" aria-hidden="true"></i>
              <small>Publish as website</small>
            </button>
          </li>
          <li class="nav-item">
            <a id="edit-link" href="/tools/policy-generator/" class="nav-link btn btn-primary-outline mx-1">
              <i class="fa-solid fa-pen" aria-hidden="true"></i>
              <small>Edit answers</small>
            </a>
          </li>
        </ul>
        <p class="small mb-0" id="copy-status" role="status" aria-live="polite"></p>
      </div>
      <div id="policy-content">
        {% include "policy_content.html" %}
      </div>
    </div>
    <div class="col-12 col-sm-12 col-md-1 col-lg-1 col-xl-1"></div>
  </div>
</div>
<script>
  (function () {
    const status = document.getElementById('copy-status');
    document.querySelector('.lead').textContent = (new URLSearchParams(location.search).get('organization') || '').trim() || 'Our organization';
    const content = document.getElementById('policy-content');
    document.getElementById('print-link').href += location.search;
    document.getElementById('edit-link').href += location.search;
    // Placeholders until the PDF export and publishing flows are built.
    for (const id of ['download-pdf', 'publish-site'])
      document.getElementById(id).addEventListener('click', function () { alert('TODO: not built yet'); });
    document.getElementById('copy-link').addEventListener('click', function () {
      navigator.clipboard.writeText(location.href).then(function () { status.textContent = 'Link copied.'; });
    });
    document.getElementById('copy-text').addEventListener('click', function () {
      navigator.clipboard.write([
        new ClipboardItem({
          'text/html': new Blob([content.innerHTML], { type: 'text/html' }),
          'text/plain': new Blob([content.innerText], { type: 'text/plain' })
        })
      ]).then(function () { status.textContent = 'Policy copied.'; });
    });
  })();
</script>
