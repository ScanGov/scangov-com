name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Playwright's official image ships Chromium and its system libraries, so
    # ramp-check skips the apt-get and browser download that used to take
    # most of the job. Keep the tag aligned with @playwright/test in
    # package.json; bump both together. --ipc=host is Playwright's
    # recommendation for Chromium in Docker.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    permissions:
      contents: write
      pull-requests: write   # ramp-check posts one PR comment with its report
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Persist npm cache
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}

      - name: Persist Eleventy .cache
        uses: actions/cache@v5
        with:
          path: ./.cache
          key: ${{ runner.os }}-eleventy-fetch-cache

      - run: npm install
      - run: npm run build
      - run: node scripts/check-sitemap-completeness.js

      # Two audits before the deploy. ramp-check owns accessibility (axe plus
      # motion, keyboard, reflow, text spacing, consistency); the ScanGov
      # action covers the other four topics, so nothing is reported twice.
      # Both write to the job summary; ramp-check also comments on PRs.

      # ramp-check needs the site reachable over HTTP. The container has no
      # Python, so a built-ins-only Node server does it. Port and pages:
      # ramp-check.config.js
      - name: Serve the built site
        run: |
          node scripts/serve-site.mjs _site 8080 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/ >/dev/null && break; sleep 0.5; done

      # continue-on-error until a baseline is recorded (npm run a11y:baseline,
      # commit a11y-baseline.json); after that remove it so new accessibility
      # findings fail the job. https://github.com/Mayor-s-Office-of-Innovation/ramp-check
      - name: Accessibility (ramp-check)
        uses: Mayor-s-Office-of-Innovation/ramp-check/action@main
        continue-on-error: true
        with:
          config: ramp-check.config.js

      # Lighthouse (chrome-launcher) looks for Chrome on PATH or at
      # CHROME_PATH. The container has no system Chrome; point it at the
      # Chromium Playwright baked into the image.
      - name: Point Lighthouse at the image's Chromium
        run: echo "CHROME_PATH=$(node -e 'console.log(require("playwright-core").chromium.executablePath())')" >> "$GITHUB_ENV"

      # Audit the built site against ScanGov standards. Accessibility is
      # left out of topics because ramp-check covers it. Report only: results
      # go to the job summary and never hold up the deploy. Add `block: true`
      # and a `fail-on` topic under `with:` to gate the deploy.
      # https://github.com/ScanGov/action
      - name: ScanGov audit
        uses: ScanGov/action@v1.0.4
        with:
          site-dir: _site
          canonical-domain: scangov.com
          topics: usability,botability,security,readability

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
